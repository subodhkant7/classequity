# HISTORICAL REFERENCE ONLY: this is not an active Blueprint sync.
# Uses an EXISTING classequity-db (now on an independently managed paid plan).
# This file creates no database. Verify branch and resources before adapting.
# Set the external/internal DATABASE_URL privately. Do not commit it here.
services:
  - type: web
    name: classequity
    runtime: node
    plan: free
    region: singapore
    branch: codex/hosted-webhook-verification # historical deployed source; do not auto-switch to main
    # Existing schema is checked without writes. Migrations/seeding are controlled separately.
    buildCommand: npm ci --include=dev && npm run release:check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: 'true'
      - key: HOSTED_RESTRICT_PUBLIC_AI
        value: 'true'
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Live Twilio delivery is outside this phase; do not provision its credentials.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
